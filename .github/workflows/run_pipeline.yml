
name: Run AI News Pipeline

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours

  workflow_dispatch:        # Manual trigger

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # SETUP PYTHON
      # ------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ------------------------------------------
      # INSTALL DEPENDENCIES
      # ------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------
      # VERIFY GROQ CONFIGURATION
      # ------------------------------------------
      - name: Verify Groq configuration
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}

        run: |
          echo "Checking Groq configuration..."

          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is missing."
            exit 1
          fi

          if [ -z "$GROQ_MODEL" ]; then
            echo "::error::GROQ_MODEL is missing or empty."
            echo "Configure GROQ_MODEL under GitHub Actions Variables or Secrets."
            exit 1
          fi

          echo "GROQ_API_KEY: Configured"
          echo "GROQ_MODEL: Configured"

      # ------------------------------------------
      # RUN NEWS PIPELINE
      # ------------------------------------------
      - name: Run pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}

        run: |
          python pipeline.py
