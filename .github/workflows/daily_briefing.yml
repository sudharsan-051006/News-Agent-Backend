name: Daily 7:00 AM Trend Radar Briefing

on:
  schedule:
    # 07:00 AM IST = 01:30 AM UTC every day
    - cron: '30 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install & Start Ollama (Zero API Keys)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          until curl -s http://localhost:11434/api/tags > /dev/null; do
            echo "Waiting for Ollama daemon to initialize..."
            sleep 2
          done
          echo "Pulling lightweight CPU-optimized model: llama3.2:3b..."
          ollama pull llama3.2:3b
          echo "Ollama is ready and running locally on runner."

      - name: Run Trend Radar Pipeline & Dispatch Briefing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: "ollama"
          OLLAMA_MODEL: "llama3.2:3b"
          OLLAMA_BASE_URL: "http://localhost:11434"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_HOST: "smtp.gmail.com"
          EMAIL_PORT: "587"
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          ENABLE_SIGNIFICANCE_GATE: "true"
          CRITIC_APPROVAL_THRESHOLD: "8.5"
          MIN_TREND_VELOCITY_SCORE: "3.0"
        run: |
          python main.py --run-now --force
